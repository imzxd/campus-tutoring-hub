<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estimate tutoring/service cost based on selected options.">
  <meta name="keywords" content="quote, calculator, pricing form">
  <link rel="icon" type="image/svg+xml" href="assets/media/images/item08.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/themes/theme-classic.css">
  <link rel="stylesheet" href="assets/css/themes/theme-ocean.css">
  <link rel="stylesheet" href="assets/css/themes/theme-sunset.css">
  <title>Session Estimate | Campus Tutoring Hub</title>
</head>
<body data-theme="classic">
  <header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html">Campus Tutoring Hub</a><button class="mobile-toggle" id="mobileToggle">Menu</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="request-service.html">Service Request</a><a class="active" href="quote-calculator.html">Estimate</a><a href="help/index.html">Help</a></nav></div></header>
  <main class="container">
    <h1>Session Estimate</h1>
    
    <form id="quoteForm" class="card">
      <div class="form-grid">
        <div>
          <label for="packageType">Package Type</label>
          <select id="packageType" name="packageType">
            <option value="45">Standard ($45)</option>
            <option value="70">Advanced ($70)</option>
          </select>
        </div>
        <div>
          <label for="supportType">Support Type</label>
          <select id="supportType" name="supportType">
            <option value="10">Email Support ($10)</option>
            <option value="25">Live Session ($25)</option>
          </select>
        </div>
        <div>
          <label for="sessions">Number of Sessions</label>
          <input id="sessions" name="sessions" type="number" min="1" value="1">
        </div>
      </div>
      <button class="btn" type="submit">Calculate</button>
      <p id="quoteResult" class="notice" aria-live="polite">Estimated quote will appear here.</p>
    </form>
  </main>
  <footer class="site-footer"><div class="footer-wrap">Campus Tutoring Hub</div></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
