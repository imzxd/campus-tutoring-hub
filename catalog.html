<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse 20 tutoring service offerings with filtering and search.">
  <meta name="keywords" content="tutoring services, subject filter, session search">
  <link rel="icon" type="image/svg+xml" href="assets/media/images/item04.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/themes/theme-classic.css">
  <link rel="stylesheet" href="assets/css/themes/theme-ocean.css">
  <link rel="stylesheet" href="assets/css/themes/theme-sunset.css">
  <title>Services | Campus Tutoring Hub</title>
</head>
<body data-theme="classic">
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">Campus Tutoring Hub</a>
      <button class="mobile-toggle" id="mobileToggle">Menu</button>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a class="active" href="catalog.html">Services</a>
        <a href="search.html">Search</a>
        <a href="product.html?id=1">Service Detail</a>
        <a href="dashboard.html">Private Area</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Services</h1>
    

    <section class="card">
      <div class="form-grid">
        <div>
          <label for="searchInput">Search by name</label>
          <input id="searchInput" type="text" placeholder="Type service name...">
        </div>
        <div>
          <label for="categoryFilter">Filter by category</label>
          <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Math">Math</option>
            <option value="Science">Science</option>
            <option value="Writing">Writing</option>
            <option value="Programming">Programming</option>
            <option value="Business">Business</option>
            <option value="Communication">Communication</option>
            <option value="Advising">Advising</option>
            <option value="Career">Career</option>
          </select>
        </div>
      </div>
    </section>

    <section id="catalogList" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer"><div class="footer-wrap">Campus Tutoring Hub</div></footer>
  <script src="assets/js/catalog-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
