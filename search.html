<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search Services quickly by keyword and category.">
  <meta name="keywords" content="search, tutoring filter, service query">
  <link rel="icon" type="image/svg+xml" href="assets/media/images/item06.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/themes/theme-classic.css">
  <link rel="stylesheet" href="assets/css/themes/theme-ocean.css">
  <link rel="stylesheet" href="assets/css/themes/theme-sunset.css">
  <title>Search | Campus Tutoring Hub</title>
</head>
<body data-theme="classic">
  <header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html">Campus Tutoring Hub</a><button class="mobile-toggle" id="mobileToggle">Menu</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="catalog.html">Services</a><a class="active" href="search.html">Search</a><a href="help/index.html">Help</a></nav></div></header>
  <main class="container">
    <h1>Search Services</h1>
    
    <section class="card">
      <div class="form-grid">
        <div><label for="searchInput">Keyword</label><input id="searchInput" placeholder="e.g., calculus"></div>
        <div><label for="categoryFilter">Category</label><select id="categoryFilter"><option value="all">All</option><option value="Math">Math</option><option value="Science">Science</option><option value="Writing">Writing</option><option value="Programming">Programming</option><option value="Business">Business</option><option value="Communication">Communication</option><option value="Advising">Advising</option><option value="Career">Career</option></select></div>
      </div>
    </section>
    <section id="catalogList" class="grid"></section>
  </main>
  <footer class="site-footer"><div class="footer-wrap"></div></footer>
  <script src="assets/js/catalog-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
