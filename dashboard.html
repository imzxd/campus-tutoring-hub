<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private user area for profile, service history, and request tracking.">
  <meta name="keywords" content="private area, user dashboard, tracking">
  <link rel="icon" type="image/svg+xml" href="assets/media/images/item09.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/themes/theme-classic.css">
  <link rel="stylesheet" href="assets/css/themes/theme-ocean.css">
  <link rel="stylesheet" href="assets/css/themes/theme-sunset.css">
  <title>User Dashboard | Campus Tutoring Hub</title>
</head>
<body data-theme="classic">
  <header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html">Campus Tutoring Hub</a><button class="mobile-toggle" id="mobileToggle">Menu</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a class="active" href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a><a href="history.html">History</a><a href="login.html">Logout</a></nav></div></header>
  <main class="container">
    <h1>Private User Area</h1>
    

    <section class="grid">
      <article class="card fade-up"><h3>Open Requests</h3><p>3 active service requests</p></article>
      <article class="card fade-up"><h3>Request Status</h3><p>1 session in progress</p></article>
      <article class="card fade-up"><h3>Saved Theme</h3><p>Stored in browser localStorage</p></article>
    </section>

    <section class="chart-box fade-up">
      <h2>Weekly Activity Chart</h2>
      <canvas id="usageChart" width="460" height="220" aria-label="Activity chart"></canvas>
    </section>
  </main>
  <footer class="site-footer"><div class="footer-wrap">Campus Tutoring Hub</div></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
