<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit tutoring or support requests with attachment-ready form fields.">
  <meta name="keywords" content="service request, tutoring, support form">
  <link rel="icon" type="image/svg+xml" href="assets/media/images/item07.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/themes/theme-classic.css">
  <link rel="stylesheet" href="assets/css/themes/theme-ocean.css">
  <link rel="stylesheet" href="assets/css/themes/theme-sunset.css">
  <title>Service Request | Campus Tutoring Hub</title>
</head>
<body data-theme="classic">
  <header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html">Campus Tutoring Hub</a><button class="mobile-toggle" id="mobileToggle">Menu</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="catalog.html">Services</a><a class="active" href="request-service.html">Service Request</a><a href="quote-calculator.html">Estimate</a></nav></div></header>
  <main class="container">
    <h1>Submit Service Request</h1>
    
    <form id="serviceRequestForm" class="card">
      <div class="form-grid">
        <div><label for="fullName">Full Name</label><input id="fullName" name="fullName" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        <div><label for="serviceType">Service Type</label><select id="serviceType" name="serviceType"><option>Tutoring</option><option>Homework Support</option><option>Study Planning</option></select></div>
        <div><label for="urgency">Urgency</label><select id="urgency" name="urgency"><option>Standard</option><option>High</option><option>Urgent</option></select></div>
      </div>
      <p><label for="details">Request Details</label><textarea id="details" name="details" required></textarea></p>
      <p><label for="attachment">Attachment</label><input id="attachment" type="file"></p>
      <button class="btn" type="submit">Submit Request</button>
      <p id="requestResult" class="notice" aria-live="polite"></p>
    </form>
  </main>
  <footer class="site-footer"><div class="footer-wrap">Campus Tutoring Hub</div></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
